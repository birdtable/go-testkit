kind: Added
body: 'canary: a test plants fake secrets with New, or a value of its own with Own, hands them to the program under test, and checks with Files, Reader, Bytes and Value that none reached a file under a folder (a SQLite file and its -wal and -journal read as raw bytes, with no driver), a captured stream or the text of a returned value. Each value is looked for as it is, as hex, as base64 and URL-safe base64 at any alignment, as a URL query or path escape and as UTF-16. A hit fails the test naming the value''s name, the place, the byte offset and the encoding, never the value. Files follows no link and reads no FIFO, socket or device, and a file it cannot read fails the test.'
