kind: Added
body: '`BuildAt(t, ref, pkg)` builds a program as it was at an earlier tag, branch or commit of the repository the test runs in, for upgrade tests that run an old release beside the current one. It takes `Build`''s arguments in the same order, adds the ref, and returns the same `*Binary`, so `X` stamps, `Env` and `Run` work as before. It reads the old tree with `git archive` into the test''s temp folder and builds it with that tree''s own `go.mod` and `go.sum`; it adds no worktree, checks nothing out and leaves `.git` as it was. Two refs that name one commit build once. A ref or package that starts with `-`, a ref that names no commit, and a package outside the repository fail the test, naming the ref; they never skip it. Under `GoOffline` a module the old tree needs that the module cache lacks fails the build, naming the module.'
