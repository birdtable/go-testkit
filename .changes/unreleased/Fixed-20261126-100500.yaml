kind: Fixed
body: 'NoNetwork''s doc says what a uid 0 caller''s tests hold on Linux, every capability of the nested user namespace and none over the network namespace, and that NoNetwork goes before contain.Contain. As uid 0, a refusal of the namespace inside contain''s containment says to put NoNetwork first, and one outside it names a container''s seccomp profile, which refuses a new user namespace, never an option the caller did not pass.'
