kind: Added
body: 'canary: `(*Set).Zip(path)` checks each entry of the zip archive at path, a support bundle among them: each entry''s name, a hit there at `InPath`, as `Files` searches a path, and each entry''s bytes, Stored or Deflate, through the same chunked read as `Reader`, so its memory is one chunk whatever an entry''s size. A hit''s place is the archive''s path, `!` and the entry''s name, each value in it as `<name>`, with `CheckZip` as its check, the byte offset in the entry and the encoding. An archive `archive/zip` cannot open, and an entry it cannot read, a checksum that does not match or a compression method it does not know among them, fail the test. It does not open a zip archive inside an entry, which it reads as that entry''s bytes, nor read an encrypted entry''s bytes, whose name it reads, nor read tar, gzip or 7z. `Files` is unchanged: it still reads a zip archive as raw bytes, and its doc points to `Zip`.'
