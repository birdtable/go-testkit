kind: Added
body: 'canary: `(*Set).Expect(name, paths...)` is a check of one folder in which a planted value must be, an app''s own secrets file among them, and its `(*Expected).Files(dir)` checks that folder as `Files` does but for one thing: a hit of that value, in any encoding, in the bytes of a path named for it is no failure. Each path is relative to the folder, cleaned, and names one regular file, with no globs; `(*Expected).Expect` names another value, so one file may hold more than one. What it does not excuse: the value in the expected file''s own name or a folder above it, in a link''s target and in any other file, in any encoding, and any other value in the expected file, are hits as before. A path that names nothing, a folder, a link or no regular file fails the test, and so does a path whose bytes do not hold its value in any encoding, so no check passes because a path was named; an expected file that is not, when open, the file the walk saw there, as when a link is swapped in for it, is not read and fails the test; each line names the path and the value''s name, never the value. A name never planted, no path, a path that is absolute, names a drive or a share, or leaves the folder, and a path named twice for one name stop the test. Only `(*Expected).Files` takes an expectation: the Set''s own `Files`, and `Zip`, `Reader`, `Bytes` and `Value`, excuse nothing.'
