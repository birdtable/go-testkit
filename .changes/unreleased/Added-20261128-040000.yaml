kind: Added
body: '`Socket(t, path)` plants a file that is not regular at path, inside a folder, the same on Linux, macOS and Windows (10 1803 and later): an AF_UNIX socket file, which `os.Lstat`, `os.Stat` and `os.ReadDir` report with `fs.ModeSocket`. A read of it fails at its open, at once (ENXIO on Linux, EOPNOTSUPP on macOS, ERROR_CANT_ACCESS_FILE on Windows). It is built on the standard library''s AF_UNIX listener. It adds a path of any length, because the socket is made in a short folder under `os.TempDir` and renamed to path, and it holds no listener after the call. The test''s cleanup removes it, so the folder that held it can be removed. The only setting is the path. The test fails on a path that is already taken, a missing folder of path''s, a temporary folder too long for a socket''s path in it (the failure names `SocketPathMax`), or a socket the system will not make. For a test of code that refuses a file that is not regular in a read or a walk: `HoldRead` is a named pipe on Windows, in no folder.'
