kind: Added
body: 'sizecap, a package of its own: `Prove(t, limit, over, parse, opts...)` proves a reader''s size cap at its edge, for a parser of any format. It runs `parse` on an input of exactly `limit` bytes and wants it read to the end and no error that is `over` (`errors.Is`), then on `limit+1` bytes and wants `over`. Each failure names the side that broke and the sizes, shows what `parse` returned, and never shows the input''s bytes; both sides run, so a cap off by one in either direction is named by the side it breaks. The input is spaces by default, made as it is read, so a cap of a GiB costs no GiB of memory; `Fill(func(n int64) io.Reader)` gives each side''s input from the caller''s own reader, for a format that refuses spaces, cut at n bytes, and a reader that ends short fails the side naming fill. A side at the cap that `parse` stops reading before the cap proves nothing and fails, so a parser that refuses the filler as malformed does not pass for the wrong reason. A limit of 0 or less or of math.MaxInt64, a nil over, parse, Option or fill, and a fill that gives a nil reader stop the test. The package imports the standard library only.'
