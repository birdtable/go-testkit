# Runs go vet and go test on GitHub's hosted runners, in each of the repository's three modules: the
# root, contain and taskfile, each in its own folder. A pull request runs on Linux and Windows; a push
# to main, a tag and a run by hand run on macOS too. It holds no secret, and its token reads the
# repository's contents alone. Every module is fetched by go's defaults, through the public Go module
# proxy, as a program that imports go-testkit fetches them, and nothing is kept in the Actions cache.
# go keeps its default -mod=readonly, so a go.mod or go.sum that is not tidy is refused.
name: test

# A tag runs the three jobs at the tagged sha, which is a release's proof: v* for the root module,
# contain/v* and taskfile/v* for the nested ones.
on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*', 'contain/v*', 'taskfile/v*']
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch, pull request or tag cancels the run it supersedes, so its runners
# are freed for the next one.
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        # The hosted macOS runners are a small pool that the organization's repositories share, and
        # a job that waits for one can wait out its whole timeout. So a pull request leaves macOS out,
        # and main, a tag and a run by hand test on it. On any other event this excludes no os.
        exclude:
          - os: ${{ github.event_name == 'pull_request' && 'macos-latest' || 'none' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      # The whole history and its tags: internal/contract's tests read each module's last tag with git
      # describe, and fail in a shallow clone.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      # Ubuntu's runners keep an unprivileged account from mapping itself in a new user namespace
      # (AppArmor's restrict_unprivileged_userns), which contain's Linux tests need, as a stock Linux
      # allows: those of contain_linux_test.go, mounts_linux_test.go and rerun_linux_test.go make a
      # user and PID namespace. This lifts that rule on the runner alone; the tests still run as the
      # runner's own account, with no root.
      - name: allow unprivileged user namespaces
        if: runner.os == 'Linux'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      # cmd/apigate's tests build apidiff from tools/apidiff.mod with the network off, as a test
      # binary under testkit's GoOffline does, so that file's modules are fetched first. They are
      # golang.org/x modules, all public.
      - name: fetch apidiff's modules
        run: go mod download -modfile=tools/apidiff.mod
      - name: go vet
        run: |
          go vet ./...
          (cd contain && go vet ./...)
          (cd taskfile && go vet ./...)
      # go test runs as the release tier runs it, with the race detector, in shuffled order and never
      # from the test cache, and writes its events as JSON for the step after it to count. Each of
      # the three modules runs whether or not one before it failed, and the step is red if any did.
      - name: go test
        id: test
        run: |
          race=-race
          if [ "$(go env CGO_ENABLED)" != 1 ]; then
            race=
          fi
          echo "GO_TEST_RACE=${race:-off}" >> "$GITHUB_ENV"
          events="$RUNNER_TEMP/go-test.json"
          status=0
          go test -json $race -shuffle=on -count=1 ./... > "$events" || status=1
          (cd contain && go test -json $race -shuffle=on -count=1 ./...) >> "$events" || status=1
          (cd taskfile && go test -json $race -shuffle=on -count=1 ./...) >> "$events" || status=1
          exit $status
      # Counts the passed, failed and skipped tests of the three modules into the log and the job
      # summary, prints each failed or skipped test's own output, and is red on any failure and on
      # any skip: a test that skips on a runner proves nothing there.
      - name: test counts
        if: ${{ !cancelled() && steps.test.outcome != 'skipped' }}
        env:
          TEST_OUTCOME: ${{ steps.test.outcome }}
        run: |
          events="$RUNNER_TEMP/go-test.json"
          count() { jq -R -n --arg a "$1" '[inputs | fromjson? | select(.Test != null and .Action == $a)] | length' "$events" | tr -d '\r'; }
          passed=$(count pass)
          failed=$(count fail)
          skipped=$(count skip)
          jq -R -n -r '[inputs | fromjson? | select(.Test != null)] as $e
            | ($e | map(select(.Action == "fail" or .Action == "skip") | .Package + " " + .Test)) as $bad
            | $e[] | select(.Action == "output") | select((.Package + " " + .Test) as $k | any($bad[]; . == $k)) | .Output' "$events" | tr -d '\r'
          jq -R -n -r '[inputs | fromjson? | select(.Test == null and .Action == "fail")] | .[] | "FAIL " + .Package' "$events" | tr -d '\r'
          line="tests: $passed passed, $failed failed, $skipped skipped (race $GO_TEST_RACE)"
          echo "$line"
          echo "$line" >> "$GITHUB_STEP_SUMMARY"
          if [ "$TEST_OUTCOME" != success ] || [ "$failed" -ne 0 ] || [ "$skipped" -ne 0 ] || [ "$passed" -eq 0 ]; then
            exit 1
          fi
