# Runs only by hand, never on a push, a tag or a pull request: a release is checked and made on a
# maintainer's host, and this is kept for a release made on hosted runners instead. The release tier runs on Linux and on
# Windows, and the release is created, with the changie entry as its notes, only when both are green.
#
# Two inputs, read by every job through an expression or a step's environment, never pasted into a
# script, so no input's text is ever run as shell:
#   - ref, a full commit sha: the tiers run at that commit and nothing is published. The publish job
#     is skipped, so no release, tag or artifact but the fetch job's module cache is made. This is the
#     run a release pull request makes at its reviewed head, before the tag.
#   - tag, as v0.1.0, with ref empty: the tiers run at that tag, and publish creates its release.
# A run with neither, or with a ref that is not a full sha, fails in fetch and runs no tier.
#
# Nothing is kept in the Actions cache: setup-go's cache is off in every job. Its post step would
# save the tier jobs' GOMODCACHE, which holds the fetched modules' source, and would never hit. The
# one thing kept is the fetch job's artifact, for one day.
#
# The tools hatch (tools/hatch.mod) and the go-proc it requires are fetched with a token, so the modules are
# fetched by one job and handed to the tier jobs, which hold no token, so no code of the tree
# runs beside a token:
#   - fetch holds a token of the org's read-only GitHub App, narrowed to hatch and go-proc and
#     Contents: read, made by create-github-app-token from the repository secrets BIRDTABLE_APP_ID and
#     BIRDTABLE_APP_KEY. The token is in the one step that downloads, in that step's environment and in
#     no file. That step runs go mod download and go mod tidy -diff for go.mod, go mod download for each
#     tools/*.mod, go mod download for contain through a workspace where the tree has it (the
#     workspace stands in for the root's own tag), and go mod download and go mod tidy -diff for
#     taskfile where the tree has it, so every module a tier reads is fetched. A tools/*.mod is not tidied: its
#     module is "tools", so tidy takes the tree's own packages for another module's and looks for
#     github.com/birdtable/go-testkit, which the token does not reach; no tier tidies one either, and
#     go tool builds each from what go mod download fetched. go mod tidy -diff writes nothing to the
#     tree, and the job runs no other code of it. It uploads the module download cache, and not the
#     VCS cache, so nothing it wrote under the token's name leaves the job. The artifact holds the
#     source fetched with the token, so it is kept for a day, and only those who can read this repository
#     can read it.
#   - tier-linux and tier-windows download that cache and run with GOPROXY=off and no secret, so the
#     tree's code, its tests and its tools never see a token. go keeps its default -mod=readonly there,
#     so a tier that would change go.mod or a tools/*.mod fails, as on a maintainer's host. Each tier's step "this
#     job holds no token" proves it before the tier runs.
#
# A hosted runner starts with no build cache and has four cores, so each tier job runs task warm, as a
# step of its own and untimed, before the tier: the tools and the race test binaries are then built
# before any member's timeout starts, so no member times out on a cold build. Its job's timeout, 45 minutes, allows for
# that cold build; gate/budget.sh applies no budget on a hosted runner, so the job's timeout is the only
# clock there. No member, timeout or budget of a maintainer's host's tier changes.
name: release

on:
  workflow_dispatch:
    inputs:
      ref:
        description: a full commit sha to run the tiers at; nothing is published
        required: false
        default: ""
      tag:
        description: with ref empty, the tag to run the tiers at and release, as v0.1.0
        required: false
        default: ""

permissions:
  contents: read

# bash on each system, Git's on Windows, so the tier's commands find diff and the other tools its
# scripts call, as they do on Linux.
defaults:
  run:
    shell: bash

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: a full commit sha, or a tag
        env:
          REF: ${{ inputs.ref }}
          TAG: ${{ inputs.tag }}
        run: |
          if [ -n "$REF" ]; then
            case "$REF" in
            *[!0-9a-f]*) echo "::error::ref is '$REF', and wants a full commit sha, 40 lowercase hex digits"; exit 1 ;;
            esac
            if [ "${#REF}" -ne 40 ]; then echo "::error::ref is '$REF', and wants a full commit sha, 40 lowercase hex digits"; exit 1; fi
            echo "the tiers run at $REF, and nothing is published"
          elif [ -n "$TAG" ]; then
            echo "the tiers run at the tag $TAG, which is released if both are green"
          else
            echo "::error::neither ref nor tag is set, so there is nothing to run the tiers at"
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || format('refs/tags/{0}', inputs.tag) }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      # app-id takes the App ID the secret holds; client-id, which replaces it, takes the Client ID.
      - id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.BIRDTABLE_APP_ID }}
          private-key: ${{ secrets.BIRDTABLE_APP_KEY }}
          owner: birdtable
          repositories: hatch,go-proc
          permission-contents: read
      # git reads its URL rewrite from the environment of this step alone: nothing is written to a git
      # config file, and go's VCS cache is not uploaded.
      - name: download the modules, the tools' too, and what go mod tidy reads
        env:
          TOKEN: ${{ steps.app.outputs.token }}
          GOPRIVATE: github.com/birdtable/*
          GIT_TERMINAL_PROMPT: "0"
        run: |
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0="url.https://x-access-token:${TOKEN}@github.com/.insteadOf"
          export GIT_CONFIG_VALUE_0="https://github.com/"
          go mod download
          go mod tidy -diff
          for m in tools/*.mod; do
            go mod download -modfile="$m"
          done
          # contain, where the tree has it, through a workspace like the Taskfile's CONTAIN_WORK: its
          # go.mod requires the root at a version no proxy holds before the tag and the token does not
          # reach, which the workspace replaces with this tree's root. go mod tidy reads that version's
          # go.mod even so, so contain's tidy is the local tier's, not this step's.
          if [ -f contain/go.mod ]; then
            ver=$(awk '$1 == "github.com/birdtable/go-testkit" && $2 ~ /^v/ { print $2; exit } $1 == "require" && $2 == "github.com/birdtable/go-testkit" { print $3; exit }' contain/go.mod)
            [ -n "$ver" ] || { echo "::error::contain/go.mod names no version of the root"; exit 1; }
            w="$RUNNER_TEMP/contain-work"
            mkdir -p "$w"
            (cd "$w" && GOWORK='' go work init "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/contain" \
              && GOWORK='' go work edit -replace="github.com/birdtable/go-testkit@$ver=$GITHUB_WORKSPACE")
            (cd contain && GOWORK="$w/go.work" go mod download)
            for os in linux windows; do
              (cd contain && GOWORK="$w/go.work" GOPROXY=off GOOS=$os go list -deps -test ./... > /dev/null) \
                || { echo "::error::contain's packages for $os do not load from what was downloaded"; exit 1; }
            done
          fi
          # taskfile, where the tree has it: it requires no version of the root, so it needs no
          # workspace, and its tidy is read here as the root's is.
          if [ -f taskfile/go.mod ]; then
            (cd taskfile && go mod download && go mod tidy -diff) \
              || { echo "::error::taskfile's modules could not be downloaded, or its go.mod is not tidy"; exit 1; }
            for os in linux windows; do
              (cd taskfile && GOPROXY=off GOOS=$os go list -deps -test ./... > /dev/null) \
                || { echo "::error::taskfile's packages for $os do not load from what was downloaded"; exit 1; }
            done
          fi
      - id: cache
        run: echo "dir=$(go env GOMODCACHE)/cache/download" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gomod
          path: ${{ steps.cache.outputs.dir }}
          if-no-files-found: error
          retention-days: 1

  tier-linux:
    needs: fetch
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.ref || format('refs/tags/{0}', inputs.tag) }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      # contain's tests make a user namespace of their own and mount in it. Ubuntu's AppArmor (24.04
      # and later) restricts an unprivileged user namespace: it is made, then refused its mounts,
      # "the mounts of the namespace could not be made private: permission denied", so every
      # contained row skips and contain-test, which fails any skip, is red, as a hosted run
      # showed before this step was added. The restriction is turned off for this job's runner by the sysctl
      # Ubuntu documents for it, as go-proc's and go-files' tier-linux do, so the rows run as on any
      # other Linux. A runner with no such key is red here, not green with the rows skipped.
      - name: unprivileged user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: gomod
          path: ${{ runner.temp }}/gomod/cache/download
      - name: the modules come from the fetch job
        run: |
          {
            echo "GOMODCACHE=${RUNNER_TEMP}/gomod"
            echo "GOPROXY=off"
            echo "GOPRIVATE=github.com/birdtable/*"
          } >> "$GITHUB_ENV"
      # The proof the tier holds no token, resting on what the job holds and on no repository's
      # visibility: no token variable; no git credential header, the
      # bare http.extraheader as well as one for a URL, and no URL rewrite, pushInsteadOf too; no
      # netrc file in HOME, .netrc or _netrc, which git's curl reads by itself and no helper is asked
      # about; and no credential that git's helpers hand out for github.com. What the helpers answer
      # is read into a variable and never printed. The step's timeout stops a helper that would wait
      # for a person.
      - name: this job holds no token
        timeout-minutes: 5
        env:
          GIT_TERMINAL_PROMPT: "0"
          GCM_INTERACTIVE: never
        run: |
          refuse() { echo "::error::$1, so this job holds a token"; exit 1; }
          if [ -n "${GH_TOKEN-}${GITHUB_TOKEN-}${TOKEN-}" ]; then refuse "GH_TOKEN, GITHUB_TOKEN or TOKEN is set"; fi
          if git config --get-regexp '^(http\.(.*\.)?extraheader|url\..*\.(push)?insteadof)$' > /dev/null; then refuse "git has a credential header or a URL rewrite"; fi
          for f in "$HOME/.netrc" "$HOME/_netrc"; do if [ -e "$f" ]; then refuse "a netrc file is at $f"; fi; done
          cred=$(printf 'protocol=https\nhost=github.com\n\n' | git credential fill 2> /dev/null) || true
          case "$cred" in *password=?*) refuse "git's credential helpers hand out a credential for github.com" ;; esac
          echo "no token variable is set, git holds no credential header or URL rewrite, no netrc file is in HOME, and git's helpers hand out no credential for github.com"
      - name: warm, untimed
        run: go tool -modfile=tools/task.mod task warm
      - name: the release tier
        run: go tool -modfile=tools/task.mod task release

  tier-windows:
    needs: fetch
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.ref || format('refs/tags/{0}', inputs.tag) }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: gomod
          path: ${{ runner.temp }}/gomod/cache/download
      - name: the modules come from the fetch job
        run: |
          {
            echo "GOMODCACHE=${RUNNER_TEMP}/gomod"
            echo "GOPROXY=off"
            echo "GOPRIVATE=github.com/birdtable/*"
          } >> "$GITHUB_ENV"
      # The proof the tier holds no token, resting on what the job holds and on no repository's
      # visibility: no token variable; no git credential header, the
      # bare http.extraheader as well as one for a URL, and no URL rewrite, pushInsteadOf too; no
      # netrc file in HOME, .netrc or _netrc, which git's curl reads by itself and no helper is asked
      # about; and no credential that git's helpers hand out for github.com. What the helpers answer
      # is read into a variable and never printed. The step's timeout stops a helper that would wait
      # for a person.
      - name: this job holds no token
        timeout-minutes: 5
        env:
          GIT_TERMINAL_PROMPT: "0"
          GCM_INTERACTIVE: never
        run: |
          refuse() { echo "::error::$1, so this job holds a token"; exit 1; }
          if [ -n "${GH_TOKEN-}${GITHUB_TOKEN-}${TOKEN-}" ]; then refuse "GH_TOKEN, GITHUB_TOKEN or TOKEN is set"; fi
          if git config --get-regexp '^(http\.(.*\.)?extraheader|url\..*\.(push)?insteadof)$' > /dev/null; then refuse "git has a credential header or a URL rewrite"; fi
          for f in "$HOME/.netrc" "$HOME/_netrc"; do if [ -e "$f" ]; then refuse "a netrc file is at $f"; fi; done
          cred=$(printf 'protocol=https\nhost=github.com\n\n' | git credential fill 2> /dev/null) || true
          case "$cred" in *password=?*) refuse "git's credential helpers hand out a credential for github.com" ;; esac
          echo "no token variable is set, git holds no credential header or URL rewrite, no netrc file is in HOME, and git's helpers hand out no credential for github.com"
      - name: warm, untimed
        run: go tool -modfile=tools/task.mod task warm
      - name: the release tier
        run: go tool -modfile=tools/task.mod task release

  # The only job that writes. It needs both tiers: one red or cancelled and nothing is published. A
  # run with ref set publishes nothing: this job is skipped. gh reads the notes file through any
  # link, and its environment holds GH_TOKEN, so a notes file that is a link, or is reached through a
  # linked folder, would publish what it points at. Nothing is published unless
  # .changes/<tag>.md is a regular file at that path in the tag's tree, with at least one changie
  # item line.
  publish:
    needs: [tier-linux, tier-windows]
    if: inputs.ref == ''
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: refs/tags/${{ inputs.tag }}
      - name: publish the entry as the notes
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          notes=".changes/$TAG.md"
          refuse() { echo "$notes $1, so nothing is published"; exit 1; }
          if [ -L "$notes" ]; then refuse "is a link"; fi
          if [ ! -f "$notes" ]; then refuse "is missing or not a regular file"; fi
          if [ "$(realpath "$notes")" != "$(pwd -P)/$notes" ]; then refuse "is reached through a linked folder"; fi
          if ! grep -q '^[*-] ' "$notes"; then refuse "holds no changie item line"; fi
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --title "$TAG" --notes-file "$notes"
